<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e27;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#111842;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1235;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#7b2fff;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="glow2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7b2fff;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#ff2d95;stop-opacity:0.6" />
    </linearGradient>
    <linearGradient id="glow3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.4" />
      <stop offset="50%" style="stop-color:#7b2fff;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#ff2d95;stop-opacity:0.4" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7b2fff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="nodeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7b2fff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff2d95;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="nodeGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffa3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:1" />
    </linearGradient>
    <filter id="blur1">
      <feGaussianBlur in="SourceGraphic" stdDeviation="20" />
    </filter>
    <filter id="blur2">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" />
    </filter>
    <filter id="glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" />
    </filter>
    <radialGradient id="pulse1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="pulse2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#7b2fff;stop-opacity:0.25" />
      <stop offset="100%" style="stop-color:#7b2fff;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="pulse3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ff2d95;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#ff2d95;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)" rx="12" />

  <!-- Ambient glow effects -->
  <circle cx="200" cy="200" r="180" fill="url(#pulse1)" filter="url(#blur1)" />
  <circle cx="600" cy="200" r="200" fill="url(#pulse2)" filter="url(#blur1)" />
  <circle cx="1000" cy="200" r="160" fill="url(#pulse3)" filter="url(#blur1)" />

  <!-- Neural network graph - edges (connections) -->
  <!-- Layer 1 to Layer 2 -->
  <line x1="95" y1="100" x2="200" y2="80" stroke="#00d4ff" stroke-width="1.2" opacity="0.4" />
  <line x1="95" y1="100" x2="210" y2="160" stroke="#00d4ff" stroke-width="1" opacity="0.3" />
  <line x1="85" y1="180" x2="200" y2="80" stroke="#00d4ff" stroke-width="1" opacity="0.25" />
  <line x1="85" y1="180" x2="210" y2="160" stroke="#00d4ff" stroke-width="1.4" opacity="0.5" />
  <line x1="85" y1="180" x2="195" y2="240" stroke="#00d4ff" stroke-width="1.2" opacity="0.35" />
  <line x1="100" y1="260" x2="210" y2="160" stroke="#00d4ff" stroke-width="1" opacity="0.3" />
  <line x1="100" y1="260" x2="195" y2="240" stroke="#00d4ff" stroke-width="1.3" opacity="0.45" />
  <line x1="90" y1="330" x2="195" y2="240" stroke="#00d4ff" stroke-width="1" opacity="0.3" />
  <line x1="90" y1="330" x2="205" y2="310" stroke="#00d4ff" stroke-width="1.2" opacity="0.4" />

  <!-- Layer 2 to Layer 3 -->
  <line x1="200" y1="80" x2="320" y2="120" stroke="#5a5fff" stroke-width="1.5" opacity="0.45" />
  <line x1="200" y1="80" x2="310" y2="200" stroke="#5a5fff" stroke-width="1" opacity="0.3" />
  <line x1="210" y1="160" x2="320" y2="120" stroke="#5a5fff" stroke-width="1.2" opacity="0.4" />
  <line x1="210" y1="160" x2="310" y2="200" stroke="#5a5fff" stroke-width="1.6" opacity="0.55" />
  <line x1="210" y1="160" x2="315" y2="280" stroke="#5a5fff" stroke-width="1" opacity="0.3" />
  <line x1="195" y1="240" x2="310" y2="200" stroke="#5a5fff" stroke-width="1.3" opacity="0.4" />
  <line x1="195" y1="240" x2="315" y2="280" stroke="#5a5fff" stroke-width="1.4" opacity="0.5" />
  <line x1="205" y1="310" x2="315" y2="280" stroke="#5a5fff" stroke-width="1.2" opacity="0.4" />

  <!-- Layer 3 to Layer 4 (convergence) -->
  <line x1="320" y1="120" x2="420" y2="160" stroke="#7b2fff" stroke-width="1.5" opacity="0.5" />
  <line x1="310" y1="200" x2="420" y2="160" stroke="#7b2fff" stroke-width="1.8" opacity="0.6" />
  <line x1="310" y1="200" x2="415" y2="260" stroke="#7b2fff" stroke-width="1.5" opacity="0.5" />
  <line x1="315" y1="280" x2="415" y2="260" stroke="#7b2fff" stroke-width="1.6" opacity="0.55" />

  <!-- Layer 4 to output -->
  <line x1="420" y1="160" x2="500" y2="200" stroke="#ff2d95" stroke-width="2" opacity="0.5" />
  <line x1="415" y1="260" x2="500" y2="200" stroke="#ff2d95" stroke-width="2" opacity="0.5" />

  <!-- Spike train visualization (left side - incoming data) -->
  <polyline points="20,95 30,95 32,60 34,95 44,95 46,70 48,95 58,95 60,50 62,95 72,95"
            stroke="#00d4ff" stroke-width="1.5" fill="none" opacity="0.7" />
  <polyline points="15,175 25,175 27,150 29,175 39,175 41,140 43,175 53,175 55,155 57,175 67,175"
            stroke="#00d4ff" stroke-width="1.5" fill="none" opacity="0.6" />
  <polyline points="25,255 35,255 37,230 39,255 49,255 51,220 53,255 63,255 65,240 67,255 77,255"
            stroke="#00d4ff" stroke-width="1.5" fill="none" opacity="0.5" />
  <polyline points="20,325 30,325 32,300 34,325 44,325 46,310 48,325 58,325 60,290 62,325 72,325"
            stroke="#00d4ff" stroke-width="1.5" fill="none" opacity="0.4" />

  <!-- Neural network nodes - Layer 1 (input) -->
  <circle cx="95" cy="100" r="7" fill="url(#nodeGrad)" opacity="0.9" />
  <circle cx="95" cy="100" r="7" fill="none" stroke="#00d4ff" stroke-width="0.5" opacity="0.5" filter="url(#blur2)" />
  <circle cx="85" cy="180" r="8" fill="url(#nodeGrad)" opacity="0.95" />
  <circle cx="85" cy="180" r="8" fill="none" stroke="#00d4ff" stroke-width="0.5" opacity="0.5" filter="url(#blur2)" />
  <circle cx="100" cy="260" r="6" fill="url(#nodeGrad)" opacity="0.8" />
  <circle cx="90" cy="330" r="7" fill="url(#nodeGrad)" opacity="0.85" />

  <!-- Layer 2 -->
  <circle cx="200" cy="80" r="8" fill="url(#nodeGrad)" opacity="0.9" />
  <circle cx="200" cy="80" r="12" fill="none" stroke="#00d4ff" stroke-width="0.5" opacity="0.3" filter="url(#blur2)" />
  <circle cx="210" cy="160" r="10" fill="url(#nodeGrad)" opacity="1" />
  <circle cx="210" cy="160" r="15" fill="none" stroke="#00d4ff" stroke-width="0.5" opacity="0.3" filter="url(#blur2)" />
  <circle cx="195" cy="240" r="9" fill="url(#nodeGrad)" opacity="0.9" />
  <circle cx="205" cy="310" r="7" fill="url(#nodeGrad)" opacity="0.85" />

  <!-- Layer 3 -->
  <circle cx="320" cy="120" r="9" fill="url(#nodeGrad2)" opacity="0.9" />
  <circle cx="320" cy="120" r="14" fill="none" stroke="#7b2fff" stroke-width="0.5" opacity="0.3" filter="url(#blur2)" />
  <circle cx="310" cy="200" r="11" fill="url(#nodeGrad2)" opacity="1" />
  <circle cx="310" cy="200" r="16" fill="none" stroke="#7b2fff" stroke-width="0.5" opacity="0.35" filter="url(#blur2)" />
  <circle cx="315" cy="280" r="9" fill="url(#nodeGrad2)" opacity="0.9" />

  <!-- Layer 4 (convergence) -->
  <circle cx="420" cy="160" r="10" fill="url(#nodeGrad2)" opacity="0.95" />
  <circle cx="420" cy="160" r="16" fill="none" stroke="#7b2fff" stroke-width="0.6" opacity="0.3" filter="url(#blur2)" />
  <circle cx="415" cy="260" r="9" fill="url(#nodeGrad2)" opacity="0.9" />

  <!-- Output node (prediction) -->
  <circle cx="500" cy="200" r="13" fill="url(#nodeGrad3)" opacity="1" />
  <circle cx="500" cy="200" r="20" fill="none" stroke="#00ffa3" stroke-width="0.8" opacity="0.35" filter="url(#blur2)" />
  <circle cx="500" cy="200" r="28" fill="none" stroke="#00ffa3" stroke-width="0.4" opacity="0.15" filter="url(#blur2)" />

  <!-- Title text -->
  <text x="600" y="155" font-family="'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="white" text-anchor="middle" letter-spacing="-1">
    Synapse<tspan fill="url(#glow1)">Graph</tspan>
  </text>

  <!-- Subtitle -->
  <text x="600" y="200" font-family="'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#c8d0e8" text-anchor="middle" letter-spacing="3" font-weight="400">
    BRAIN-COMPUTER INTERFACE MEMORY LAYER
  </text>

  <!-- Tagline -->
  <text x="600" y="240" font-family="'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5a6680" text-anchor="middle" letter-spacing="1">
    Spike Trains  &#x2192;  Cognitive Graph  &#x2192;  Intent Prediction  &#x2192;  Adaptation
  </text>

  <!-- Stats bar at bottom -->
  <rect x="0" y="370" width="1200" height="30" fill="#080b1a" opacity="0.8" rx="0" />
  <line x1="0" y1="370" x2="1200" y2="370" stroke="url(#glow3)" stroke-width="1" opacity="0.5" />

  <!-- Stat items -->
  <text x="120" y="390" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" fill="#00d4ff" text-anchor="middle" letter-spacing="0.5">
    10 CRATES
  </text>
  <text x="300" y="390" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" fill="#5a5fff" text-anchor="middle" letter-spacing="0.5">
    15,000 LINES
  </text>
  <text x="480" y="390" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" fill="#7b2fff" text-anchor="middle" letter-spacing="0.5">
    204 TESTS
  </text>
  <text x="660" y="390" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" fill="#a855f7" text-anchor="middle" letter-spacing="0.5">
    545KB WASM
  </text>
  <text x="840" y="390" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" fill="#ff2d95" text-anchor="middle" letter-spacing="0.5">
    7 ADRs
  </text>
  <text x="1020" y="390" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" fill="#ff6b6b" text-anchor="middle" letter-spacing="0.5">
    no_std + WASM
  </text>

  <!-- Decorative dots between stats -->
  <circle cx="210" cy="387" r="2" fill="#2a3050" />
  <circle cx="390" cy="387" r="2" fill="#2a3050" />
  <circle cx="570" cy="387" r="2" fill="#2a3050" />
  <circle cx="750" cy="387" r="2" fill="#2a3050" />
  <circle cx="930" cy="387" r="2" fill="#2a3050" />

  <!-- Thin border -->
  <rect width="1200" height="400" fill="none" stroke="#1a2040" stroke-width="1" rx="12" />
</svg>
