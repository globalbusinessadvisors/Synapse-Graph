[workspace]
resolver = "2"
members = [
    "crates/synapse-graph-types",
    "crates/synapse-graph-core",
    "crates/synapse-graph-wasm",
    "crates/synapse-graph-ingestion",
    "crates/synapse-graph-memory",
    "crates/synapse-graph-temporal",
    "crates/synapse-graph-cognitive",
    "crates/synapse-graph-prediction",
    "crates/synapse-graph-adaptation",
    "crates/synapse-graph-provenance",
]

[workspace.dependencies]
# Layer 0 -- ruvector ecosystem (ADR-007)
ruvector-core = "2.0.5"
ruvector-math = "2.0.4"
ruvector-collections = "2.0.4"

# Serialization
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = "1"
